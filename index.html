<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>雾镇书影</title>
    <link rel="stylesheet" href="./styles.css?v=20260826-mobile-fit-v4" />
  </head>
  <body>
    <main class="app-shell" aria-live="polite">
      <section class="level-select" id="level-select" aria-labelledby="level-select-title">
        <header class="level-head">
          <p class="product">Murdoku</p>
          <h1 id="level-select-title">选择案件</h1>
          <p class="level-intro">每个案件都来自已验证题包，进入后再根据线索复原六人的位置。</p>
        </header>
        <div class="level-list" id="level-list"></div>
      </section>

      <section class="game-screen is-hidden" id="game-screen">
        <div class="game-layout">
          <aside class="suspect-column">
            <div class="sidebar-topbar">
              <button class="back-button" id="back-button" type="button">返回</button>
            </div>
            <header class="game-head">
              <div>
                <p class="product">Murdoku</p>
                <h1 id="puzzle-title">雾镇书影</h1>
              </div>
            </header>

            <section class="story-card" id="story-card" aria-label="场景描述">
              <p id="story-text"></p>
            </section>

            <section class="general-clues" aria-labelledby="general-clues-title">
              <h2 id="general-clues-title">通用线索</h2>
              <div class="general-clue-card" id="general-clue-card"></div>
            </section>

            <section class="people-panel" aria-labelledby="people-title">
              <div class="people-heading">
                <h2 id="people-title">嫌疑人</h2>
                <div class="person-carousel-nav" aria-label="人物线索卡切换">
                  <button class="person-carousel-button" id="person-prev" type="button" aria-label="上一位嫌疑人">←</button>
                  <span class="person-carousel-status" id="person-carousel-status" aria-live="polite"></span>
                  <button class="person-carousel-button" id="person-next" type="button" aria-label="下一位嫌疑人">→</button>
                </div>
              </div>
              <p class="instruction">选中人物后，单击格子添加或取消候选虚影；长按 1 秒正式放置。经过或选中格子会高亮整个区域。</p>
              <div class="person-list" id="person-list"></div>
            </section>

            <section class="investigation-panel" id="investigation-panel" aria-labelledby="investigation-title" hidden>
              <div class="investigation-heading">
                <div>
                  <p class="investigation-kicker">可选支线</p>
                  <h2 id="investigation-title">追加线索</h2>
                </div>
                <span class="investigation-progress" id="investigation-progress">0 / 0</span>
              </div>
              <p class="investigation-intro" id="investigation-intro"></p>
              <div class="investigation-list" id="investigation-list"></div>
              <div class="investigation-complete" id="investigation-complete" hidden></div>
            </section>
          </aside>

          <!-- 手机适配：棋盘和工具栏共用一个工作区，窄屏时工具栏横排在棋盘上方。 -->
          <div class="board-workspace">
            <section class="board-stage" aria-labelledby="board-title">
              <h2 id="board-title">棋盘</h2>
              <div class="board-wrap">
                <div class="board" id="board"></div>
              </div>
            </section>

            <aside class="tool-rail" aria-label="棋盘工具">
              <button class="tool-button tool-investigate" id="tool-investigate" type="button" aria-pressed="false" hidden>
                <span class="tool-icon">⌕</span>
                <span class="tool-caption">调查物件</span>
              </button>
              <button class="tool-button tool-clear" id="tool-clear" type="button" aria-pressed="false">
                <span class="tool-icon">X</span>
                <span class="tool-caption">标记格子</span>
              </button>
              <button class="tool-button tool-eraser" id="tool-eraser" type="button">
                <span class="tool-icon">◆</span>
                <span class="tool-caption">擦除标记/人物</span>
              </button>
              <button class="tool-button tool-undo" id="tool-undo" type="button" disabled>撤销</button>
              <button class="submit-button" id="submit-button" type="button" disabled>
                提交
                <span id="submit-caption">请先放置所有人</span>
              </button>
              <button class="help-button" id="help-button" type="button">玩法说明</button>
              <div class="feedback" id="feedback" hidden></div>
            </aside>
          </div>
        </div>
      </section>
    </main>

    <script type="module">
      const buildVersion = new URLSearchParams(window.location.search).get('build') || String(Date.now());
      import(`./app.js?v=${encodeURIComponent(buildVersion)}`);
    </script>
  </body>
</html>
